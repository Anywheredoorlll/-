[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-rag-ft"
version = "0.1.0"
description = "Auditable aviation answer-finetuning dataset builder"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "starlette>=0.40,<2",
  "streamlit>=1.39,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
aviation-ft = "aviation_ft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aviation_ft = ["web_app/static/*", "review_app/*.css"]
